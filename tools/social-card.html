<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QAgentExt social card source</title>
<!--
  The source of public/assets/social-card.png (1200 x 630, the Open Graph and
  Twitter card size). Rendered to PNG with tools/render-social-card.cjs from a
  checkout of the extension repository, which has Playwright installed.
  Everything here is the site's own palette, icon and a real screenshot; no
  web fonts, nothing loaded from elsewhere.
-->
<style>
  :root { --bg: #101416; --surface: #192124; --ink: #f3f7f5; --muted: #bac8c8; --line: #384747; --accent: #7be2bd; --cyan: #86d8ed; --amber: #f7d680; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .glow--a { width: 520px; height: 520px; left: -160px; top: -200px; background: rgba(123, 226, 189, .28); }
  .glow--b { width: 620px; height: 620px; right: -220px; bottom: -300px; background: rgba(134, 216, 237, .22); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.15)); }
  .copy { position: absolute; left: 72px; top: 72px; width: 600px; }
  .eyebrow { color: var(--accent); font-size: 18px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .name { display: flex; align-items: center; gap: 22px; margin-top: 22px; }
  .name img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 40px rgba(123, 226, 189, .25); }
  .name h1 { font-size: 86px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .tagline { margin-top: 30px; font-size: 30px; line-height: 1.35; color: var(--muted); max-width: 560px; }
  .tagline b { color: var(--ink); font-weight: 650; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .pill { font-size: 19px; font-weight: 650; padding: 9px 16px; border-radius: 100px; border: 1.5px solid var(--line); background: rgba(25, 33, 36, .85); color: var(--ink); }
  .pill--accent { border-color: rgba(123, 226, 189, .55); color: var(--accent); }
  .pill--cyan { border-color: rgba(134, 216, 237, .55); color: var(--cyan); }
  .pill--amber { border-color: rgba(247, 214, 128, .55); color: var(--amber); }
  .footer { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: baseline; gap: 22px; font-size: 21px; color: var(--muted); }
  .footer .url { color: var(--ink); font-weight: 700; font-size: 24px; }
  .footer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); align-self: center; }
  .shot { position: absolute; left: 700px; top: 118px; width: 640px; border-radius: 16px; border: 1.5px solid var(--line); overflow: hidden; background: #111a18; box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 10px rgba(25, 33, 36, .6); transform: rotate(-3deg); transform-origin: left top; }
  .shot img { display: block; width: 640px; height: 400px; }
  .shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 70%, rgba(16, 20, 22, .25)); }
  .badge { position: absolute; left: 700px; top: 72px; font-size: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .badge b { color: var(--accent); }
</style>
</head>
<body>
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="grid"></div>
  <div class="copy">
    <div class="eyebrow">Chrome extension &middot; Browser testing</div>
    <div class="name"><img src="../public/assets/icon-128.png" alt=""><h1>QAgentExt</h1></div>
    <p class="tagline"><b>Record</b> a browser flow. <b>Replay</b> it as a test. <b>Export</b> the script.</p>
    <div class="pills">
      <span class="pill pill--accent">Record &rarr; Replay &rarr; Export</span>
      <span class="pill pill--cyan">WCAG 2.2 checks</span>
      <span class="pill pill--amber">iOS via Appium</span>
      <span class="pill">CLI for CI</span>
    </div>
  </div>
  <div class="badge">Actual result &middot; <b>passed</b></div>
  <div class="shot"><img src="../public/assets/02-replay.png" alt=""></div>
  <div class="footer"><span class="url">qagentext.netlify.app</span><span class="dot"></span><span>Free &middot; no account &middot; runs in your browser</span></div>
</body>
</html>
